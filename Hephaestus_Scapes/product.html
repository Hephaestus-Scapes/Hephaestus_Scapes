<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>躲避屋系列 - Hephaestus Scapes</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800">

    <!-- 導覽列 -->
    <nav class="container mx-auto px-6 py-6 flex justify-between items-center border-b border-stone-200">
        <div class="text-2xl md:text-3xl font-bold text-stone-800 tracking-wider flex items-center">
            <a href="index.html">Hephaestus Scapes</a> <span class="ml-3 text-xl md:text-2xl font-medium text-stone-600">| 赫菲斯微景</span>
        </div>
        <div class="space-x-6 text-sm text-stone-500 font-medium hidden md:flex items-center">
            <a href="javascript:history.back()" class="hover:text-stone-900 transition">↶ 回上一頁</a>
            <a href="index.html" class="hover:text-stone-900 transition">⌂ 返回首頁</a>
        </div>
    </nav>

    <!-- 分類目錄與商品列表區塊 -->
    <section class="container mx-auto px-6 py-12 flex flex-col md:flex-row gap-10">
        
        <!-- 左側：小目錄 (Sidebar) -->
        <aside class="w-full md:w-1/4">
            <!-- 使用 sticky 讓目錄在往下滑動時會固定在畫面上方 -->
            <div class="sticky top-10 bg-white p-6 rounded-2xl shadow-sm border border-stone-100">
                <h3 class="text-lg font-extrabold text-stone-800 mb-6">商品分類</h3>
                <ul class="space-y-2">
                    <!-- 目前所在的分類 (深色底凸顯) -->
                    <li>
                        <a href="#" class="block px-4 py-3 bg-stone-800 text-white rounded-lg font-bold transition">
                            躲避屋系列
                        </a>
                    </li>
                    <!-- 其他分類 (淺灰字體，滑過變深) -->
                    <li>
                        <a href="#" class="block px-4 py-3 text-stone-500 hover:bg-stone-100 hover:text-stone-800 rounded-lg transition font-medium">
                            仿生漂流木
                        </a>
                    </li>
                    <li>
                        <a href="#" class="block px-4 py-3 text-stone-500 hover:bg-stone-100 hover:text-stone-800 rounded-lg transition font-medium">
                            水族專用造景
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- 右側：商品展示列表 (Main Content) -->
        <main class="w-full md:w-3/4">
            <div class="mb-8">
                <h1 class="text-3xl font-extrabold text-stone-800 mb-2">躲避屋系列</h1>
                <p class="text-stone-500">專為爬行動物設計的 3D 列印庇護所，提供安全感與完美的攀爬表面。</p>
            </div>

            <!-- 商品網格 (Grid) -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                
                <!-- 第一個商品：擬真岩洞躲避屋 (可點擊進入細節頁) -->
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-stone-200 flex flex-col hover:shadow-lg transition">
                    <img src="主頁大圖1.png" alt="擬真岩洞躲避屋" class="w-full h-48 object-cover">
                    <div class="p-5 flex flex-col flex-grow">
                        <h3 class="text-lg font-bold mb-1">擬真岩洞躲避屋</h3>
                        <p class="text-stone-500 text-xs mb-4 flex-grow">帶有水盆空間，豐富風化紋理。</p>
                        <div class="text-lg font-bold text-stone-800 mb-4">NT$ 850</div>
                        <!-- 連結到剛才改名的 detail.html -->
                        <a href="detail.html" class="block text-center bg-yellow-400 text-stone-900 px-4 py-2 rounded-lg hover:bg-yellow-500 transition font-bold text-sm">
                            查看細節 / 購買
                        </a>
                    </div>
                </div>

                <!-- 第二個商品：樹頭躲避屋 (敬請期待) -->
                <div class="bg-stone-100 rounded-2xl overflow-hidden border border-stone-200 flex flex-col opacity-80">
                    <img src="主頁大圖3.png" alt="樹狀躲避屋" class="w-full h-48 object-cover grayscale">
                    <div class="p-5 flex flex-col flex-grow">
                        <h3 class="text-lg font-bold mb-1 text-stone-500">雨林樹頭躲避屋</h3>
                        <p class="text-stone-500 text-xs mb-4 flex-grow">結合自然樹根造型，適合樹棲型守宮。</p>
                        <div class="text-lg font-bold text-stone-400 mb-4">即將推出</div>
                        <button disabled class="w-full text-center border-2 border-stone-300 text-stone-400 bg-stone-200 px-4 py-2 rounded-lg cursor-not-allowed font-medium text-sm">
                            敬請期待
                        </button>
                    </div>
                </div>

                <!-- 第三個商品：岩板躲避屋 (敬請期待) -->
                <div class="bg-stone-100 rounded-2xl overflow-hidden border border-stone-200 flex flex-col opacity-80">
                    <img src="主頁大圖4.png" alt="多層岩板躲避屋" class="w-full h-48 object-cover grayscale">
                    <div class="p-5 flex flex-col flex-grow">
                        <h3 class="text-lg font-bold mb-1 text-stone-500">多層岩板躲避屋</h3>
                        <p class="text-stone-500 text-xs mb-4 flex-grow">層疊幾何結構，提供多角度攀爬體驗。</p>
                        <div class="text-lg font-bold text-stone-400 mb-4">即將推出</div>
                        <button disabled class="w-full text-center border-2 border-stone-300 text-stone-400 bg-stone-200 px-4 py-2 rounded-lg cursor-not-allowed font-medium text-sm">
                            敬請期待
                        </button>
                    </div>
                </div>

            </div>
        </main>
    </section>

    <!-- Footer 頁尾 -->
    <footer class="bg-stone-900 text-stone-400 py-12 border-t border-stone-200 mt-12">
        <div class="container mx-auto px-6 text-center">
            <h4 class="text-white text-lg font-bold mb-4 tracking-widest">Hephaestus Scapes</h4>
            <p class="text-sm text-stone-600">&copy; 2026 Hephaestus Scapes. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
