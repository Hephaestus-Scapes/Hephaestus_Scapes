<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>結帳 · Hephaestus Scapes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#F7F7F5] text-stone-900">
  <header class="border-b border-stone-200 bg-white/90">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5">
      <a href="index.html" class="flex items-center gap-3">
        <img src="Logo.png" alt="Hephaestus Scapes" class="h-10 w-auto">
        <span class="text-sm tracking-[0.18em] text-stone-700">HEPHAESTUS SCAPES</span>
      </a>
      <a href="cart.html" class="text-sm text-stone-600 hover:text-stone-950">返回購物車</a>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-6 py-12">
    <div class="mb-10">
      <p class="text-xs tracking-[0.25em] text-stone-400">CHECKOUT</p>
      <h1 class="mt-2 text-3xl font-light tracking-wide">確認訂單</h1>
      <p class="mt-3 text-sm leading-6 text-stone-500">
        請確認收件資料與付款方式後送出訂單。訂單價格與庫存將由伺服器再次驗證。
      </p>
    </div>

    <div id="empty" class="hidden rounded-2xl border border-stone-200 bg-white p-10 text-center">
      <p class="text-stone-500">購物車目前沒有商品。</p>
      <a href="product.html" class="mt-5 inline-block text-sm underline underline-offset-4">返回商品頁</a>
    </div>

    <form id="checkoutForm" class="grid gap-8 lg:grid-cols-[1fr_360px]">
      <div class="space-y-6">
        <section class="rounded-2xl border border-stone-200 bg-white p-6">
          <h2 class="text-lg font-medium">收件資料</h2>
          <div class="mt-6 grid gap-5 sm:grid-cols-2">
            <label class="block">
              <span class="text-sm text-stone-600">姓名 *</span>
              <input name="name" required class="mt-2 w-full rounded-xl border border-stone-200 px-4 py-3 outline-none focus:border-stone-500" placeholder="王小明">
            </label>
            <label class="block">
              <span class="text-sm text-stone-600">手機 *</span>
              <input name="phone" required inputmode="tel" class="mt-2 w-full rounded-xl border border-stone-200 px-4 py-3 outline-none focus:border-stone-500" placeholder="0912345678">
            </label>
            <label class="block sm:col-span-2">
              <span class="text-sm text-stone-600">Email *</span>
              <input name="email" type="email" required class="mt-2 w-full rounded-xl border border-stone-200 px-4 py-3 outline-none focus:border-stone-500" placeholder="you@example.com">
            </label>
            <label class="block">
              <span class="text-sm text-stone-600">縣市 *</span>
              <input name="city" required class="mt-2 w-full rounded-xl border border-stone-200 px-4 py-3 outline-none focus:border-stone-500" placeholder="台北市">
            </label>
            <label class="block">
              <span class="text-sm text-stone-600">區／鄉鎮 *</span>
              <input name="district" required class="mt-2 w-full rounded-xl border border-stone-200 px-4 py-3 outline-none focus:border-stone-500" placeholder="信義區">
            </label>
            <label class="block sm:col-span-2">
              <span class="text-sm text-stone-600">詳細地址 *</span>
              <input name="address" required class="mt-2 w-full rounded-xl border border-stone-200 px-4 py-3 outline-none focus:border-stone-500" placeholder="○○路○○號○樓">
            </label>
          </div>
        </section>

        <section class="rounded-2xl border border-stone-200 bg-white p-6">
          <h2 class="text-lg font-medium">付款方式</h2>
          <div class="mt-5">
            <label class="flex cursor-pointer items-start gap-3 rounded-xl border border-stone-200 p-4">
              <input type="radio" name="payment" value="ecpay" checked class="mt-1">
              <span>
                <span class="block text-sm font-medium">ECPay 綠界金流</span>
                <span class="mt-1 block text-xs leading-5 text-stone-500">付款方式以綠界目前審核通過、結帳頁面實際提供的項目為準。</span>
              </span>
            </label>
          </div>
        </section>

        <section class="rounded-2xl border border-stone-200 bg-white p-6">
          <label class="block">
            <span class="text-sm text-stone-600">訂單備註</span>
            <textarea name="note" rows="4" class="mt-2 w-full rounded-xl border border-stone-200 px-4 py-3 outline-none focus:border-stone-500" placeholder="例如：希望週末配送、其他需求……"></textarea>
          </label>
        </section>
      </div>

      <aside class="h-fit rounded-2xl border border-stone-200 bg-white p-6 lg:sticky lg:top-6">
        <h2 class="text-lg font-medium">訂單摘要</h2>
        <div id="summary" class="mt-5 space-y-4"></div>
        <div class="mt-6 border-t border-stone-200 pt-5">
          <div class="flex justify-between text-sm text-stone-500">
            <span>商品小計</span><span id="subtotal">NT$ 0</span>
          </div>
          <div class="mt-3 flex justify-between text-base font-medium">
            <span>應付金額</span><span id="total">NT$ 0</span>
          </div>
        </div>

        <label class="mt-6 flex items-start gap-3 text-xs leading-5 text-stone-500">
          <input id="agree" type="checkbox" required class="mt-1">
          <span>我確認以上收件資料正確，並同意送出訂單。</span>
        </label>

        <button type="submit" class="mt-5 w-full rounded-xl bg-stone-900 py-3 text-sm text-white hover:bg-stone-800">
          送出訂單
        </button>

        <p class="mt-3 text-center text-xs leading-5 text-stone-400">
          送出後將依選擇的付款方式進行後續處理。
        </p>
      </aside>
    </form>

    <div id="result" class="mt-8 hidden rounded-2xl border border-stone-200 bg-white p-8"></div>
  </main>

<script>
(function () {
  const CART_KEY = "hephaestus_cart";
  const DRAFT_KEY = "hephaestus_order_draft";

  function getCart() {
    try { return JSON.parse(localStorage.getItem(CART_KEY) || "[]"); }
    catch (e) { return []; }
  }
  function money(n) {
    return "NT$ " + Number(n).toLocaleString("zh-TW");
  }
  function orderNo() {
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    return "HS" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) +
      pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) +
      Math.random().toString(36).slice(2, 6).toUpperCase();
  }

  const cart = getCart();
  const form = document.getElementById("checkoutForm");
  const empty = document.getElementById("empty");
  const summary = document.getElementById("summary");

  if (!cart.length) {
    form.classList.add("hidden");
    empty.classList.remove("hidden");
    return;
  }

  let subtotal = 0;
  summary.innerHTML = cart.map(item => {
    const qty = Number(item.qty || 1);
    const line = Number(item.price || 0) * qty;
    subtotal += line;
    return `
      <div class="flex gap-3">
        <img src="${item.image}" class="h-16 w-16 rounded-lg object-cover bg-stone-100" alt="">
        <div class="min-w-0 flex-1">
          <p class="text-sm">${item.name}</p>
          <p class="mt-1 text-xs text-stone-400">${item.size} · ${item.color}</p>
          <p class="mt-1 text-xs text-stone-500">× ${qty}</p>
        </div>
        <span class="text-sm">${money(line)}</span>
      </div>
    `;
  }).join("");

  document.getElementById("subtotal").textContent = money(subtotal);
  document.getElementById("total").textContent = money(subtotal);

  async function fetchWithTimeout(url, options = {}, timeoutMs = 20000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);

    try {
      return await fetch(url, { ...options, signal: controller.signal });
    } catch (error) {
      if (error?.name === "AbortError") {
        throw new Error("伺服器回應逾時，請稍後再試。若持續發生，請檢查 Vercel API 設定。");
      }
      throw error;
    } finally {
      clearTimeout(timer);
    }
  }

  async function readJsonResponse(response) {
    const contentType = response.headers.get("content-type") || "";
    const raw = await response.text();

    if (!contentType.includes("application/json")) {
      throw new Error(
        response.ok
          ? "伺服器回傳了非 JSON 資料，請檢查 API 部署。"
          : `伺服器錯誤（HTTP ${response.status}），請檢查 Vercel Logs。`
      );
    }

    let data;
    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error("伺服器回傳資料格式錯誤，請檢查 Vercel Logs。");
    }

    return data;
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const fd = new FormData(form);
    const submitButton = form.querySelector('button[type="submit"]');
    submitButton.disabled = true;
    submitButton.textContent = "建立訂單中…";

    try {
      const response = await fetchWithTimeout("/api/create-order", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          customer: {
            name: fd.get("name"),
            phone: fd.get("phone"),
            email: fd.get("email"),
            city: fd.get("city"),
            district: fd.get("district"),
            address: fd.get("address")
          },
          paymentMethod: fd.get("payment"),
          note: fd.get("note") || "",
          items: cart
        })
      });

      const result = await readJsonResponse(response);

      if (!response.ok || !result.ok) {
        throw new Error(result.error || `建立訂單失敗（HTTP ${response.status}）`);
      }

      // ECPay：下一步直接由 server 建立付款表單並導轉。
      if (result.order && result.order.orderNo && fd.get("payment") === "ecpay") {
        submitButton.textContent = "前往綠界付款…";

        const pay = await fetchWithTimeout("/api/ecpay-create", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ orderNo: result.order.orderNo })
        });

        const html = await pay.text();

        if (!pay.ok) {
          let message = "無法建立 ECPay 付款頁";
          try {
            const data = JSON.parse(html);
            message = data.error || message;
          } catch {}
          throw new Error(message);
        }

        // 把 server 回傳的自動 POST 頁面載入目前頁面。
        document.open();
        document.write(html);
        document.close();
        return;
      }

      localStorage.removeItem(CART_KEY);

      document.getElementById("result").classList.remove("hidden");
      document.getElementById("result").innerHTML = `
        <p class="text-xs tracking-[0.2em] text-stone-400">ORDER CREATED</p>
        <h2 class="mt-2 text-xl font-medium">訂單已建立</h2>
        <p class="mt-3 text-sm text-stone-500">訂單編號：<strong class="text-stone-900">${result.order.orderNo}</strong></p>
        <p class="mt-2 text-sm leading-6 text-stone-500">
          付款完成後，系統會依綠界回傳結果更新訂單狀態。
        </p>
      `;

      form.classList.add("hidden");
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    } catch (error) {
      alert(error.message || "建立訂單失敗");
      submitButton.disabled = false;
      submitButton.textContent = "送出訂單";
    }
  });
})();
</script>
</body>
</html>
