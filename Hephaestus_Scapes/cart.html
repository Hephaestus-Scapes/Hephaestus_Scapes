<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>購物車 · Hephaestus Scapes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
</head>
<body class="bg-[#F7F7F5] text-stone-900 min-h-screen">
  <header class="border-b border-stone-200 bg-white/90">
    <div class="mx-auto max-w-6xl px-6 py-5 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <img src="Logo.png" alt="Hephaestus Scapes" class="h-10 w-auto">
        <span class="tracking-[0.18em] text-sm text-stone-700">HEPHAESTUS SCAPES</span>
      </a>
      <a href="product.html" class="text-sm text-stone-600 hover:text-stone-950">繼續選購</a>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-6 py-12">
    <div class="mb-10">
      <p class="text-xs tracking-[0.25em] text-stone-400">YOUR SELECTION</p>
      <h1 class="mt-2 text-3xl font-light tracking-wide">購物車</h1>
    </div>

    <section id="cartArea" class="grid gap-8 lg:grid-cols-[1fr_320px]">
      <div id="cartItems" class="space-y-4"></div>

      <aside class="h-fit rounded-2xl border border-stone-200 bg-white p-6">
        <div class="flex justify-between text-sm text-stone-500">
          <span>商品小計</span>
          <span id="subtotal">NT$ 0</span>
        </div>
        <div class="mt-4 border-t border-stone-200 pt-4 flex justify-between">
          <span class="font-medium">總計</span>
          <span id="total" class="font-medium">NT$ 0</span>
        </div>
        <a id="checkoutBtn" href="checkout.html" class="mt-6 block w-full rounded-xl bg-stone-900 py-3 text-center text-sm text-white hover:bg-stone-800">
          前往結帳
        </a>
        <p class="mt-3 text-center text-xs leading-5 text-stone-400">
          結帳時會由後端重新確認商品價格與庫存。
        </p>
      </aside>
    </section>

    <section id="emptyState" class="hidden rounded-2xl border border-stone-200 bg-white px-6 py-20 text-center">
      <p class="text-stone-500">購物車目前是空的。</p>
      <a href="product.html" class="mt-5 inline-block text-sm underline underline-offset-4">瀏覽棲息系列</a>
    </section>
  </main>

<script>
(function () {
  const STOCK = 5;
  const CART_KEY = "hephaestus_cart";

  function getCart() {
    try { return JSON.parse(localStorage.getItem(CART_KEY) || "[]"); }
    catch (e) { return []; }
  }
  function saveCart(cart) {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
  }
  function money(n) {
    return "NT$ " + Number(n).toLocaleString("zh-TW");
  }
  function render() {
    const cart = getCart();
    const itemsEl = document.getElementById("cartItems");
    const emptyEl = document.getElementById("emptyState");
    const areaEl = document.getElementById("cartArea");

    if (!cart.length) {
      areaEl.classList.add("hidden");
      emptyEl.classList.remove("hidden");
      return;
    }

    areaEl.classList.remove("hidden");
    emptyEl.classList.add("hidden");
    itemsEl.innerHTML = "";

    let subtotal = 0;

    cart.forEach((item, index) => {
      const qty = Math.max(1, Number(item.qty || 1));
      const lineTotal = Number(item.price || 0) * qty;
      subtotal += lineTotal;

      const card = document.createElement("div");
      card.className = "rounded-2xl border border-stone-200 bg-white p-5";
      card.innerHTML = `
        <div class="flex gap-5">
          <img src="${item.image}" alt="${item.name}" class="h-28 w-28 rounded-xl object-cover bg-stone-100">
          <div class="min-w-0 flex-1">
            <div class="flex justify-between gap-4">
              <div>
                <h2 class="font-medium">${item.name}</h2>
                <p class="mt-1 text-xs text-stone-500">${item.size} · ${item.color} · ${item.material}</p>
              </div>
              <button data-remove="${index}" class="text-xs text-stone-400 hover:text-stone-900">移除</button>
            </div>
            <div class="mt-5 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <button data-minus="${index}" class="h-8 w-8 rounded-lg border border-stone-200">−</button>
                <span class="w-8 text-center text-sm">${qty}</span>
                <button data-plus="${index}" class="h-8 w-8 rounded-lg border border-stone-200">＋</button>
              </div>
              <span class="font-medium">${money(lineTotal)}</span>
            </div>
            <p class="mt-2 text-xs text-stone-400">此規格庫存上限：${STOCK} 件</p>
          </div>
        </div>
      `;
      itemsEl.appendChild(card);
    });

    document.getElementById("subtotal").textContent = money(subtotal);
    document.getElementById("total").textContent = money(subtotal);
  }

  document.addEventListener("click", function (e) {
    const remove = e.target.closest("[data-remove]");
    const minus = e.target.closest("[data-minus]");
    const plus = e.target.closest("[data-plus]");

    if (remove) {
      const cart = getCart();
      cart.splice(Number(remove.dataset.remove), 1);
      saveCart(cart);
      render();
      return;
    }

    if (minus || plus) {
      const index = Number((minus || plus).dataset[minus ? "minus" : "plus"]);
      const cart = getCart();
      const item = cart[index];
      if (!item) return;

      const next = Number(item.qty || 1) + (plus ? 1 : -1);
      if (next <= 0) cart.splice(index, 1);
      else if (next <= STOCK) item.qty = next;
      else alert(`此規格目前最多 ${STOCK} 件。`);

      saveCart(cart);
      render();
    }
  });


  render();
})();
</script>
</body>
</html>
